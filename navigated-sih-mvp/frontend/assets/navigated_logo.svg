<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Filter for subtle crispness -->
    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Deep Navy Background -->
  <rect width="600" height="600" rx="40" fill="#041c38" />

  <!-- Hand-drawn / Illustrated Locomotive Group -->
  <g id="trainIllustration" transform="translate(145, 175)" filter="url(#crispShadow)">
    
    <!-- Locomotive Main Body Fill (Off-white / cream) -->
    <path d="M 24 38 
             L 108 8 
             L 266 16 
             L 268 82 
             L 12 78 
             L 10 52 
             Z" 
          fill="#f0ede6" 
          stroke="#05070a" 
          stroke-width="5.5" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Driver Cab Window -->
    <path d="M 26 44 
             L 48 41 
             L 50 62 
             L 27 64 
             Z" 
          fill="#ffffff" 
          stroke="#05070a" 
          stroke-width="4.5" 
          stroke-linejoin="round" />

    <!-- Vertical Body Louvers / Texture Stripes -->
    <line x1="72" y1="36" x2="75" y2="78" stroke="#05070a" stroke-width="5" stroke-linecap="round" />
    <line x1="102" y1="28" x2="105" y2="78" stroke="#05070a" stroke-width="5" stroke-linecap="round" />
    <line x1="140" y1="24" x2="142" y2="77" stroke="#05070a" stroke-width="5" stroke-linecap="round" />
    <line x1="172" y1="25" x2="173" y2="77" stroke="#05070a" stroke-width="5.5" stroke-linecap="round" />
    <line x1="205" y1="26" x2="206" y2="77" stroke="#05070a" stroke-width="5" stroke-linecap="round" />
    <line x1="242" y1="27" x2="243" y2="76" stroke="#05070a" stroke-width="5" stroke-linecap="round" />

    <!-- Undercarriage Chassis Rail Beam -->
    <line x1="-12" y1="84" x2="290" y2="84" stroke="#05070a" stroke-width="7" stroke-linecap="round" />
    
    <!-- Front Cowcatcher / Plow and Rear Coupling Brackets -->
    <line x1="-8" y1="84" x2="-2" y2="104" stroke="#05070a" stroke-width="6" stroke-linecap="round" />
    <line x1="286" y1="84" x2="294" y2="102" stroke="#05070a" stroke-width="6" stroke-linecap="round" />

    <!-- Black Wheels / Bogies -->
    <circle cx="28" cy="94" r="14" fill="#05070a" />
    <circle cx="68" cy="94" r="14" fill="#05070a" />
    <circle cx="204" cy="94" r="14" fill="#05070a" />
    <circle cx="244" cy="94" r="14" fill="#05070a" />
  </g>

  <!-- "Navigated" Wordmark Typography -->
  <text x="300" y="395" 
        font-family="'Outfit', 'Inter', 'Montserrat', 'Segoe UI', system-ui, sans-serif" 
        font-size="68" 
        font-weight="400" 
        letter-spacing="1" 
        fill="#ffffff" 
        text-anchor="middle">
    Navigated
  </text>
</svg>
